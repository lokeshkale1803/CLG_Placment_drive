<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Drives - Placement Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-logo">
                <i class="fa-solid fa-graduation-cap"></i> 
                <span>PlacementPortal</span>
            </a>
            <ul class="nav-menu" id="dynamicNav">
                <!-- Navigation links generated by drives.js based on auth state -->
            </ul>
            <div class="nav-auth" id="dynamicAuth">
                <!-- Auth buttons generated by drives.js -->
            </div>
            <div class="mobile-menu-icon">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
    </nav>

    <main class="dashboard-main page-main">
        <div class="page-header">
            <h1>Placement Drives</h1>
            <p>Explore and apply for the latest job openings from our partner companies.</p>
        </div>
        
        <!-- Filters could go here -->
        
        <div id="loadingState" class="state-message">
            <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
            <p>Loading placement drives...</p>
        </div>
        
        <div id="errorState" class="state-message" style="display: none;">
            <i class="fa-solid fa-triangle-exclamation fa-2x"></i>
            <p>Unable to load placement drives. Please try again later.</p>
        </div>
        
        <div id="emptyState" class="state-message" style="display: none;">
            <i class="fa-solid fa-folder-open fa-2x"></i>
            <p>No placement drives available at the moment.</p>
        </div>

        <div id="drivesContainer" class="drives-grid" style="display: none;">
            <!-- Drive cards will be dynamically injected here by drives.js -->
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/drives.js"></script>
</body>
</html>
